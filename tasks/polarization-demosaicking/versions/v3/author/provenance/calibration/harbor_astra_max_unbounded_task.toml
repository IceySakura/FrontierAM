schema_version = "1.3"
artifacts = []

[task]
name = "withexpbench/four-angle-reconstruction-wen-vnext"
version = "1.3.0-dev"
description = "Private Wen5 development trial for four-angle polarization reconstruction."

[agent]
user = "worker"
# Development has no Harbor agent time limit. Formal grading still enforces
# the separate 1 second per-scene budget in grade_local.py.

[environment]
docker_image = "local/four-angle-wen-dev:vnext"
workdir = "/workspace"
cpus = 1
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[verifier]
environment_mode = "shared"
timeout_sec = 600
