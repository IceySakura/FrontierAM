schema_version = "1.3"
artifacts = ["/workspace/submission"]

[task]
name = "frontieram/pdhcg-qp"
version = "1.0.0"
description = "Solve sparse convex QPs and return independently checked KKT certificates."

[metadata]
benchmark = "FrontierAM"

[agent]
timeout_sec = 3600

[environment]
docker_image = "frontieram-pdhcg-qp:amd64-v1"
workdir = "/workspace"
cpus = 1
memory_mb = 4096
network_mode = "no-network"

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 27000

[verifier.environment]
docker_image = "frontieram-pdhcg-qp:amd64-v1"
workdir = "/workspace"
cpus = 1
memory_mb = 4096
network_mode = "no-network"
