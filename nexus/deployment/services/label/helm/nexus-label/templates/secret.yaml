{{- $data := dict -}}
{{- if .Values.rainbow.enabled }}
{{- if .Values.rainbow.userId }}{{- $_ := set $data "RAINBOW_USER_ID" .Values.rainbow.userId }}{{- end }}
{{- if .Values.rainbow.secretKey }}{{- $_ := set $data "RAINBOW_SECRET_KEY" .Values.rainbow.secretKey }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-label.fullname" . }}
  labels:
    {{- include "nexus-label.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
