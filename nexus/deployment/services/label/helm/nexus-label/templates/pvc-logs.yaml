{{- if and .Values.logging.file .Values.logging.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexus-label.fullname" . }}-logs
  labels:
    {{- include "nexus-label.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.logging.persistence.size }}
  {{- with .Values.logging.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
