apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-label.fullname" . }}
  labels:
    {{- include "nexus-label.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexus-label.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-label.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: label
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "nexus-label.fullname" . }}
          env:
            - name: NEXUS_LABEL_PORT
              value: {{ .Values.service.port | quote }}
            {{- with .Values.logging.file }}
            - name: NEXUS_LABEL_LOG_FILE
              value: {{ . | quote }}
            - name: NEXUS_LABEL_LOG_BACKUP_COUNT
              value: {{ $.Values.logging.backupCount | quote }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: NEXUS_OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | default (include "nexus-label.name" .) | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_PROPAGATORS
              value: "tracecontext"
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: OTEL_SDK_DISABLED
              value: "true"
            {{- end }}
            {{- if .Values.rainbow.enabled }}
            - name: RAINBOW_APP_ID
              value: {{ .Values.rainbow.appId | quote }}
            - name: RAINBOW_GROUP
              value: {{ .Values.rainbow.group | quote }}
            - name: RAINBOW_ENV_NAME
              value: {{ .Values.rainbow.envName | quote }}
            - name: RAINBOW_CONNECT_STR
              value: {{ .Values.rainbow.connectStr | quote }}
            - name: RAINBOW_WATCH
              value: {{ .Values.rainbow.watch | default false | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- with .Values.logging.file }}
          volumeMounts:
            - name: logs
              mountPath: {{ dir . }}
          {{- end }}
      {{- with .Values.logging.file }}
      volumes:
        - name: logs
          {{- if $.Values.logging.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nexus-label.fullname" $ }}-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
