{{- if has "kubernetes" .Values.dynamicEnvironment.enabledProviders }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexus-distributed.componentName" (list . "environment-controller") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus-distributed.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nexus-distributed.componentName" (list . "environment-controller") }}
  namespace: {{ default .Release.Namespace .Values.dynamicEnvironment.namespace }}
  labels:
    {{- include "nexus-distributed.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nexus-distributed.componentName" (list . "environment-controller") }}
  namespace: {{ default .Release.Namespace .Values.dynamicEnvironment.namespace }}
  labels:
    {{- include "nexus-distributed.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nexus-distributed.componentName" (list . "environment-controller") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nexus-distributed.componentName" (list . "environment-controller") }}
{{- end }}
