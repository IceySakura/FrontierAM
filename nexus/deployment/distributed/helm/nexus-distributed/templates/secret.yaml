{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-distributed.secretName" . }}
  labels:
    {{- include "nexus-distributed.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.databaseUrlKey }}: {{ default (include "nexus-distributed.databaseUrl" .) .Values.secrets.databaseUrl | quote }}
{{- end }}
