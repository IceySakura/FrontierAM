{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus-distributed.componentName" (list . "core-ingress") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus-distributed.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus-distributed.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nexus-distributed.selectorLabels" . | nindent 14 }}
        {{- if .Values.dynamicEnvironment.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dynamicEnvironment.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "nexus-distributed.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
        {{- with .Values.networkPolicy.additionalIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
