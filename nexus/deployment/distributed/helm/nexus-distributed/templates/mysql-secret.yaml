{{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-distributed.mysqlSecretName" . }}
  labels:
    {{- include "nexus-distributed.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
stringData:
  {{ .Values.mysql.auth.rootPasswordKey }}: {{ required "mysql.auth.rootPassword is required for bundled MySQL" .Values.mysql.auth.rootPassword | quote }}
{{- end }}
