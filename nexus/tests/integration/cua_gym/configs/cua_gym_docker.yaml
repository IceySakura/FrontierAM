imports:
  - nexus.extensions.tasks.cua_gym

task_name: cua_gym
task_config:
  task_file: ${oc.env:CUA_GYM_SMOKE_TASK_FILE,"tests/integration/cua_gym/fixtures/gui_web_form_task/task.json"}
  run_setup: true
  run_evaluator: true
  unsupported_setup_policy: fail
  require_done: true
  action_space: ${oc.env:CUA_GYM_ACTION_SPACE,"pyautogui"}
  mock_hub_mode: ${oc.env:CUA_GYM_MOCK_HUB_MODE,"local"}
  mock_hub_root: ${oc.env:CUA_GYM_HUB_ROOT,"/opt/cua-gym-hub"}

runtime_provider_name: docker
runtime_provider_config:
  runtime_image: current
  force_rebuild: false
  print_port_mappings: true

runtime_configs:
  main:
    image: ${oc.env:NEXUS_CUA_GYM_SESSION_IMAGE,"mirrors.tencent.com/hunyuan_yanguan/nexus-cua-gym-session:dev-integration"}
    exposed_ports: [5900, 6080, 18000]
    extra_args:
      - --tmpfs
      - /run
      - --tmpfs
      - /run/lock
      - -e
      - GTK_A11Y=none
      - -e
      - NEXUS_GUI_REQUIRE_SYSTEM_DBUS=1

agent_name: main_agent
agent_config:
  max_iterations: ${oc.env:CUA_GYM_MAX_ITERATIONS,20}
  parallel_tool_calls: false
  image_history_limit: ${oc.env:CUA_GYM_IMAGE_HISTORY_LIMIT,6}

openai_clients:
  main:
    name: openai
    config:
      client_args:
        api_key: ${oc.env:MODEL_SERVICE_API_APP_ID}:${oc.env:MODEL_SERVICE_API_APP_KEY}?provider=azure_openai&model=${oc.env:NEXUS_MODEL,"gpt-5.5"}&timeout=${oc.env:MODEL_SERVICE_API_TIMEOUT,"60"}
        base_url: ${oc.env:MODEL_SERVICE_API_BASE_URL}
      request_args:
        model: ${oc.env:NEXUS_MODEL,"gpt-5.5"}

processors:
  chat:
    name: chat_tracker
  agent_metrics:
    name: main_agent_metrics
