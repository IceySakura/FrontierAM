imports:
  - nexus.extensions

task_name: "echo"
task_config:
  message: "Hello, Nexus!"
  run_oracle: false

runtime_provider_name: "docker"
runtime_provider_config:
  runtime_image: "current"
  force_rebuild: true

agent_name: "pi"
agent_config:
  working_dir: "/workspace"
  timeout: 3600
  version: ${oc.env:PI_VERSION,"0.84.1"}
  # 默认即为跑分档：不读仓库里的 AGENTS.md / CLAUDE.md，不信任 .pi/ 项目资源。
  # 日常开发场景改成 load_context_files: true（可再加 trust_project_files: true）。

openai_clients:
  main:
    name: "litellm"
    config:
      client_args:
        api_key: ${oc.env:PI_E2E_API_KEY,"YOUR_API_KEY_HERE"}
        base_url: ${oc.env:PI_E2E_BASE_URL,"http://trpc-gpt-eval.production.polaris:8080"}
      request_args:
        model: ${oc.env:PI_E2E_MODEL,"anthropic.claude-sonnet-4-6"}

processors:
  chat:
    name: "chat_tracker"
