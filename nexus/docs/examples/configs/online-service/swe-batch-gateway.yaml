source: online-service-swe-batch-gateway
body:
  run_id: '${oc.select:task_config.instance_id}'

  runtime_provider_name: gongfeng
  runtime_provider_config:
    api_base_url: '${oc.env:GONGFENG_RUNTIME_BASE_URL,"http://hyrl-sandbox.prod.woa.com:8052"}'
    token: '${oc.env:GONGFENG_RUNTIME_TOKEN}'
    runtime_image: current
    request_timeout: 7200
    rpc_protocol: http
    resource_spec:
      cpu: 2
      memory: 10

  agent_name: swe_agent
  agent_config:
    max_iterations: 5

  openai_clients:
    main:
      name: gateway
      config:
        client_args:
          scaffold_policy: nexus_main_agent
          openai_client:
            name: openai
            config:
              client_args:
                api_key: '${oc.env:MODEL_SERVICE_API_APP_ID}:${oc.env:MODEL_SERVICE_API_APP_KEY}?provider=ali&model=${oc.env:NEXUS_MODEL,"deepseek-v4-flash-0731"}&timeout=${oc.env:MODEL_SERVICE_API_TIMEOUT,"60"}&cache_task_id=${oc.env:MODEL_SERVICE_CACHE_TASK_ID,"f253081cf56e2e654659d294f0d58a92"}'
                base_url: '${oc.env:MODEL_SERVICE_API_BASE_URL,"http://trpc-gpt-eval.production.polaris:8080/compatible-mode/v1"}'
        request_args:
          model: '${oc.env:NEXUS_MODEL,"deepseek-v4-flash-0731"}'
        enforced_request_args:
          stream: false
          n: 1

  processors:
    chat:
      name: chat_tracker
      args:
        tools_mode: branch_last

  runner:
    timeout: 7200
