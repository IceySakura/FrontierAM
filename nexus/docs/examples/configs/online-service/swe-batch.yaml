source: online-service-swe-batch
body:
  imports:
    - nexus.extensions.tasks.swe
    - nexus.extensions.agents.swe_agent
    - nexus.extensions.openai_clients.openai
    - nexus.trace.processors.chat_tracker

  runtime_provider_name: gongfeng
  runtime_provider_config:
    api_base_url: '${oc.env:GONGFENG_RUNTIME_BASE_URL,"http://hyrl-sandbox.prod.woa.com:8052"}'
    token: '${oc.env:GONGFENG_RUNTIME_TOKEN}'
    runtime_image: current
    request_timeout: 7200
    rpc_protocol: http
    resource_spec:
      cpu: 2
      memory: 10

  agent_name: swe_agent
  agent_config:
    max_iterations: 5

  openai_clients:
    main:
      name: openai
      config:
        client_args:
          api_key: '${oc.env:MODEL_SERVICE_API_APP_ID}:${oc.env:MODEL_SERVICE_API_APP_KEY}?provider=azure_openai&model=${oc.env:NEXUS_MODEL,"gpt-5.5"}&timeout=${oc.env:MODEL_SERVICE_API_TIMEOUT,"60"}'
          base_url: '${oc.env:MODEL_SERVICE_API_BASE_URL}'
        request_args:
          model: '${oc.env:NEXUS_MODEL,"gpt-5.5"}'

  processors:
    chat:
      name: chat_tracker
      args:
        tools_mode: branch_last

  runner:
    timeout: 7200
