task_name: "identity"

task_config:
  user_inputs:
    - "Alpha"

runtime_provider_name: "docker"
runtime_configs:
  main:
    image: mirrors.tencent.com/hunyuan_yanguan/ubuntu:24.04
    worker_venv: true

agent_name: "claude_code_multiturn"
agent_config:
  pre_start_scripts:
    - code: mkdir -p /workspace
  user_prompt: "Ask the user to choose between Alpha and Beta, then report the choice."
  working_dir: "/workspace"
  version: "2.1.153"
  max_turns: 2
  timeout: 120
  enable_user_input_hooks: true
  no_thinking_request_args:
    model: "mock-model"

openai_clients:
  main:
    name: "mock"
    config:
      client_args:
        responses:
          - "title"
          - content: "I need to ask the user."
            tool_calls:
              - id: "tooluse_ask_1"
                function:
                  name: "AskUserQuestion"
                  arguments: '{"questions":[{"header":"Choice","id":"choice","question":"Which option should I use?","options":[{"label":"Alpha","description":"Use Alpha."},{"label":"Beta","description":"Use Beta."}]}]}'
          - "After AskUserQuestion result, I can continue."
      request_args:
        model: "mock-model"

processors:
  chat:
    name: "chat_tracker"
    args:
      tools_mode: "branch_last"

runner:
  timeout: 180
