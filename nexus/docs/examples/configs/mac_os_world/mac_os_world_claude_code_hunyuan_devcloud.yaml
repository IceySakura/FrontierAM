# Harness run part for a HY Chat Completions service.
# The CLI model label selects its tool protocol; HUNYUAN_MODEL pins the actual upstream model.
body:
  imports:
  - nexus.extensions.tasks.mac_os_world
  - nexus.extensions.agents.claude_code.agent
  - nexus.extensions.tasks.mac_os_world.clients
  task_name: mac_os_world
  task_config:
    wedata_key: ${oc.env:WEDATA_KEY}
    language: en
    environment_language: auto
    observation_type: screenshot
    action_space: pyautogui
    run_pre_command: true
    execute_agent: true
    run_evaluator: true
    binary_grading: true
    include_task_context: false
    prepare_screen_capture: true
    agent_mode: harness
  runtime_provider_name: devcloud
  runtime_provider_config:
    app_id: ${oc.env:DEVCLOUD_APP_ID}
    app_token: ${oc.env:DEVCLOUD_APP_TOKEN}
    sandbox_api_base_url: http://21.6.221.82:18800
    lease_time: 5400
    server_port: 5000
    request_timeout: 5400
    instance_ready_timeout: 600
    proxy_url: ${oc.env:DEVCLOUD_PROXY_URL,null}
    control_request_timeout: 120
    release_timeout: 120
    execute_mode: async
  runtime_configs:
    main:
      runtime_kind: macosworld_devcloud
      timeout: ${oc.env:MACOSWORLD_SANDBOX_TIMEOUT,4800}
  openai_clients:
    main:
      name: macosworld_infer_proxy
      config:
        client_args:
          api_key: ${oc.env:HUNYUAN_API_KEY}
          base_url: ${oc.env:HUNYUAN_BASE_URL,http://infer-api.taiji.woa.com/api/v1}
          timeout: 600
          max_retries: 3
          normalize_image_detail: true
        request_args:
          model: ${oc.env:HUNYUAN_MODEL}
          temperature: 0.9
          top_p: 1
          extra_body:
            top_k: -1
            repetition_penalty: 1
            chat_template_kwargs:
              reasoning_effort: high
        enforced_request_args:
          model: ${oc.env:HUNYUAN_MODEL}
  agent_name: claude_code_native_bridge
  agent_config:
    working_dir: /tmp/macosworld-harness
    timeout: 3600
    npm_registry: https://registry.npmjs.org
    version: 2.1.205
    ensure_claude: true
    max_turns: 100
    thinking_preset: hunyuan
    extra_cli_args:
    - --output-format
    - stream-json
    - --verbose
    extra_env:
      ANTHROPIC_MODEL: claude-opus-4-8
      CLAUDE_CODE_ATTRIBUTION_HEADER: '0'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
      API_TIMEOUT_MS: '600000'
  processors:
    chat:
      name: chat_tracker
  runner:
    timeout: 4800
merge:
  imports: append_unique
