# GPT-4o via AIHub 1.0 Chat Completions and the shared main_agent.
# Dataset: macosworld/macosworld@v1.2.0, split test. No native CUA tools.
# Required credentials: MODEL_SERVICE_API_APP_ID / MODEL_SERVICE_API_APP_KEY,
# DEVCLOUD_APP_ID / DEVCLOUD_APP_TOKEN, WEDATA_KEY.
# Task supplies the screenshot prompt, guarded PyAutoGUI tool, DONE/FAIL/WAIT,
# and automatic post-action screenshots. 15 inference turns, latest 3 images.
# This is a tool-calling baseline, not the verbatim upstream GPT-4o harness.
body:
  imports:
  - nexus.extensions.tasks.mac_os_world
  - nexus.extensions.agents.main.agent
  - nexus.extensions.tasks.mac_os_world.clients
  task_name: mac_os_world
  task_config:
    wedata_key: ${oc.env:WEDATA_KEY}
    language: en
    environment_language: auto
    observation_type: screenshot
    action_space: pyautogui
    run_pre_command: true
    prepare_screen_capture: true
    execute_agent: true
    run_evaluator: true
    binary_grading: true
    include_task_context: false
  runtime_provider_name: devcloud
  runtime_provider_config:
    app_id: ${oc.env:DEVCLOUD_APP_ID}
    app_token: ${oc.env:DEVCLOUD_APP_TOKEN}
    sandbox_api_base_url: http://21.6.221.82:18800
    lease_time: 5400
    server_port: 5000
    request_timeout: 5400
    instance_ready_timeout: 600
    proxy_url: ${oc.env:DEVCLOUD_PROXY_URL,null}
    control_request_timeout: 120
    release_timeout: 120
    execute_mode: async
  runtime_configs:
    main:
      runtime_kind: macosworld_devcloud
      timeout: ${oc.env:MACOSWORLD_SANDBOX_TIMEOUT,4800}
  openai_clients:
    main:
      name: macosworld_openai
      config:
        client_args:
          api_key: ${oc.env:MODEL_SERVICE_API_APP_ID}:${oc.env:MODEL_SERVICE_API_APP_KEY}
          base_url: ${oc.env:MODEL_SERVICE_API_BASE_URL,http://llm-api.model-eval.woa.com/v1}
          timeout: 120
          max_retries: 3
          sdk_max_retries: 0
        request_args:
          model: ${oc.env:NEXUS_MODEL,api_openai_gpt-4o-2024-11-20}
          temperature: 0
          max_tokens: 1500
          parallel_tool_calls: false
  agent_name: main_agent
  agent_config:
    max_iterations: 15
    image_history_limit: 3
    parallel_tool_calls: false
    single_tool_timeout: 120
  processors:
    chat:
      name: chat_tracker
    agent_metrics:
      name: main_agent_metrics
  runner:
    timeout: ${oc.env:MACOSWORLD_RUNNER_TIMEOUT,4800}
merge:
  imports: append_unique
