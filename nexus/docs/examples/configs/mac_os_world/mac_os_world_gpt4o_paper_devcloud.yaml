# Official GPT-4o raw-command prompt/history; Nexus Chat Completions and DevCloud transport.
# Screenshot resize is not an actual desktop resolution change; UI language stays unchanged.
body:
  imports:
  - nexus.extensions.tasks.mac_os_world
  - nexus.extensions.agents.cua.macosworld_vlm.agent
  - nexus.extensions.tasks.mac_os_world.clients
  task_name: mac_os_world
  task_config:
    wedata_key: ${oc.env:WEDATA_KEY}
    language: en
    environment_language: auto
    observation_type: screenshot
    action_space: pyautogui
    run_pre_command: true
    execute_agent: true
    run_evaluator: true
    binary_grading: true
    include_task_context: false
    prepare_screen_capture: true
  runtime_provider_name: devcloud
  runtime_provider_config:
    app_id: ${oc.env:DEVCLOUD_APP_ID}
    app_token: ${oc.env:DEVCLOUD_APP_TOKEN}
    sandbox_api_base_url: http://21.6.221.82:18800
    lease_time: 5400
    server_port: 5000
    request_timeout: 5400
    instance_ready_timeout: 600
    proxy_url: ${oc.env:DEVCLOUD_PROXY_URL,null}
    control_request_timeout: 120
    release_timeout: 120
    execute_mode: async
  runtime_configs:
    main:
      runtime_kind: macosworld_devcloud
      timeout: ${oc.env:MACOSWORLD_SANDBOX_TIMEOUT,4800}
  openai_clients:
    main:
      name: macosworld_openai
      config:
        client_args:
          api_key: ${oc.env:MODEL_SERVICE_API_APP_ID}:${oc.env:MODEL_SERVICE_API_APP_KEY}
          base_url: ${oc.env:MODEL_SERVICE_API_BASE_URL,http://llm-api.model-eval.woa.com/v1}
          timeout: 120
          max_retries: 3
          sdk_max_retries: 0
        request_args:
          model: ${oc.env:NEXUS_MODEL,api_openai_gpt-4o-2024-11-20}
          temperature: 1
          top_p: 0.9
  agent_name: macosworld_vlm
  agent_config:
    max_iterations: 30
    max_screenshots: 15
    recent_screenshots: 3
    model_display_width: 1024
    model_display_height: 768
    action_interval: 1
    action_timeout: 120
  processors:
    chat:
      name: chat_tracker
  runner:
    timeout: ${oc.env:MACOSWORLD_RUNNER_TIMEOUT,4800}
merge:
  imports: append_unique
