<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <defs>
    <marker id="gmArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="gmArrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976d2"/>
    </marker>
    <marker id="gmArrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">Gemini CLI 进程时间线</text>
  <text x="350" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666">TypeScript + node-pty，子进程模式</text>

  <!-- Time axis (vertical) -->
  <line x1="60" y1="70" x2="60" y2="480" stroke="#333" stroke-width="2" marker-end="url(#gmArrow)"/>
  <text x="55" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">时间</text>

  <!-- Process columns header -->
  <text x="180" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1565c0">Agent 进程 (Node.js)</text>
  <text x="400" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#e65100">PTY 进程 1</text>
  <text x="560" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#e65100">PTY 进程 2</text>

  <!-- Agent process (continuous vertical bar) -->
  <rect x="150" y="100" width="60" height="380" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="180" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#1565c0" transform="rotate(-90, 180, 290)">持续运行</text>

  <!-- PTY process 1 -->
  <rect x="370" y="180" width="60" height="80" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#e65100">cmd1</text>

  <!-- PTY process 2 -->
  <rect x="530" y="340" width="60" height="80" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="560" y="385" text-anchor="middle" font-family="monospace" font-size="9" fill="#e65100">cmd2</text>

  <!-- Spawn arrow 1 -->
  <line x1="210" y1="180" x2="365" y2="180" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#gmArrowBlue)"/>
  <text x="287" y="173" text-anchor="middle" font-family="monospace" font-size="8" fill="#1976d2">pty.spawn()</text>

  <!-- onExit callback 1 -->
  <line x1="370" y1="260" x2="215" y2="260" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#gmArrowGreen)"/>
  <text x="292" y="253" text-anchor="middle" font-family="monospace" font-size="8" fill="#4caf50">onExit(0)</text>

  <!-- Spawn arrow 2 -->
  <line x1="210" y1="340" x2="525" y2="340" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#gmArrowBlue)"/>
  <text x="367" y="333" text-anchor="middle" font-family="monospace" font-size="8" fill="#1976d2">pty.spawn()</text>

  <!-- onExit callback 2 -->
  <line x1="530" y1="420" x2="215" y2="420" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#gmArrowGreen)"/>
  <text x="372" y="413" text-anchor="middle" font-family="monospace" font-size="8" fill="#4caf50">onExit(0)</text>

  <!-- Process end markers -->
  <circle cx="400" cy="260" r="5" fill="#c62828"/>
  <circle cx="560" cy="420" r="5" fill="#c62828"/>

  <!-- Agent activity indicators -->
  <rect x="155" y="175" width="50" height="18" rx="2" fill="#bbdefb"/>
  <text x="180" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#1565c0">spawn</text>

  <rect x="155" y="200" width="50" height="55" rx="2" fill="#fff3e0" stroke="#ff9800" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="180" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#e65100">onData</text>

  <rect x="155" y="335" width="50" height="18" rx="2" fill="#bbdefb"/>
  <text x="180" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#1565c0">spawn</text>

  <rect x="155" y="360" width="50" height="55" rx="2" fill="#fff3e0" stroke="#ff9800" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="180" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#e65100">onData</text>

  <!-- Key code annotation -->
  <rect x="440" y="100" width="220" height="65" rx="4" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="450" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#333">核心代码</text>
  <text x="450" y="135" font-family="monospace" font-size="8" fill="#666">node-pty.spawn(shell, args)</text>
  <text x="450" y="150" font-family="monospace" font-size="8" fill="#666">ptyProcess.onExit(callback)</text>

  <!-- Key point annotation -->
  <rect x="440" y="440" width="220" height="45" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="450" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#2e7d32">特点</text>
  <text x="450" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#333">事件驱动，onExit 回调通知完成</text>
</svg>
