<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffe0b2"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f5e9"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffebee"/>
      <stop offset="100%" style="stop-color:#ffcdd2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#333">传统方案：Token 不一致问题</text>

  <!-- Round 1: Model Output -->
  <rect x="30" y="55" width="840" height="120" rx="10" fill="url(#modelGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">第一轮：模型生成</text>

  <!-- Model generates tokens -->
  <rect x="50" y="95" width="380" height="65" rx="6" fill="#fff" stroke="#1976d2" stroke-width="1"/>
  <text x="240" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">模型逐 token 输出</text>
  <text x="240" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">[t₁, t₂, t₃, ..., tₙ]</text>
  <!-- 用符号高亮双空格 -->
  <text x="240" y="152" text-anchor="middle" font-family="monospace" font-size="10">
    <tspan fill="#666">{"name": "foo",</tspan><tspan fill="#d32f2f" font-weight="bold">␣␣</tspan><tspan fill="#666">"args": {"a":</tspan><tspan fill="#d32f2f" font-weight="bold">␣␣</tspan><tspan fill="#666">1}}</tspan>
  </text>

  <!-- Arrow -->
  <line x1="430" y1="127" x2="470" y2="127" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tool Parser -->
  <rect x="480" y="95" width="180" height="65" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="570" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Tool Parser</text>
  <text x="570" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">json.loads() → json.dumps()</text>
  <text x="570" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#888">空白符被规范化</text>

  <!-- Arrow -->
  <line x1="660" y1="127" x2="700" y2="127" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Response -->
  <rect x="710" y="95" width="150" height="65" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="785" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">API 返回</text>
  <text x="785" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">arguments:</text>
  <!-- 用符号高亮单空格 -->
  <text x="785" y="152" text-anchor="middle" font-family="monospace" font-size="10">
    <tspan fill="#666">'{"a":</tspan><tspan fill="#2e7d32" font-weight="bold">␣</tspan><tspan fill="#666">1}'</tspan>
  </text>

  <!-- Arrow down -->
  <line x1="785" y1="175" x2="785" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Round 2: User sends back -->
  <rect x="30" y="210" width="840" height="120" rx="10" fill="url(#userGrad)" stroke="#4caf50" stroke-width="2"/>
  <text x="50" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">第二轮：用户传回消息</text>

  <!-- User message -->
  <rect x="550" y="250" width="310" height="65" rx="6" fill="#fff" stroke="#4caf50" stroke-width="1"/>
  <text x="705" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">用户传回 assistant message</text>
  <text x="705" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">tool_calls[0].function.arguments:</text>
  <text x="705" y="307" text-anchor="middle" font-family="monospace" font-size="10">
    <tspan fill="#666">'{"a":</tspan><tspan fill="#2e7d32" font-weight="bold">␣</tspan><tspan fill="#666">1}'</tspan>
  </text>

  <!-- Arrow -->
  <line x1="550" y1="282" x2="510" y2="282" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Postprocess -->
  <rect x="310" y="250" width="190" height="65" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="405" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e65100">_postprocess_messages</text>
  <text x="405" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">json.loads(arguments)</text>
  <text x="405" y="307" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">→ Python dict</text>

  <!-- Arrow -->
  <line x1="310" y1="282" x2="270" y2="282" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Chat Template -->
  <rect x="50" y="250" width="210" height="65" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="155" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Chat Template 渲染</text>
  <text x="155" y="290" text-anchor="middle" font-family="monospace" font-size="10" fill="#666">{{ args | tojson }}</text>
  <text x="155" y="307" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">→ 重新序列化</text>

  <!-- Arrow down -->
  <line x1="155" y1="330" x2="155" y2="355" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Round 3: Problem -->
  <rect x="30" y="365" width="840" height="125" rx="10" fill="url(#errorGrad)" stroke="#d32f2f" stroke-width="2"/>
  <text x="50" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#c62828">问题：Token 不一致</text>

  <!-- Original tokens -->
  <rect x="50" y="405" width="380" height="70" rx="6" fill="#fff" stroke="#d32f2f" stroke-width="1"/>
  <text x="240" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">第一轮模型实际输出的 tokens</text>
  <text x="240" y="445" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">[t₁, t₂, t₃, t₄, t₅, ..., tₙ]</text>
  <!-- 用符号显示双空格 -->
  <text x="240" y="465" text-anchor="middle" font-family="monospace" font-size="9">
    <tspan fill="#666">{"name": "foo",</tspan><tspan fill="#d32f2f" font-weight="bold">␣␣</tspan><tspan fill="#666">"arguments": {"a":</tspan><tspan fill="#d32f2f" font-weight="bold">␣␣</tspan><tspan fill="#666">1}}</tspan>
  </text>

  <!-- Not equal sign -->
  <text x="450" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#d32f2f">≠</text>

  <!-- Re-tokenized -->
  <rect x="480" y="405" width="380" height="70" rx="6" fill="#fff" stroke="#d32f2f" stroke-width="1"/>
  <text x="670" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">第二轮重新 tokenize 的 tokens</text>
  <text x="670" y="445" text-anchor="middle" font-family="monospace" font-size="11" fill="#d32f2f">[t₁', t₂', t₃', ..., tₘ']</text>
  <!-- 用符号显示单空格 -->
  <text x="670" y="465" text-anchor="middle" font-family="monospace" font-size="9">
    <tspan fill="#666">{"name": "foo",</tspan><tspan fill="#2e7d32" font-weight="bold">␣</tspan><tspan fill="#666">"arguments": {"a":</tspan><tspan fill="#2e7d32" font-weight="bold">␣</tspan><tspan fill="#666">1}}</tspan>
  </text>

</svg>
