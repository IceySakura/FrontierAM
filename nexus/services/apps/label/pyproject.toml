[project]
name = "nexus-label"
version = "0.1.0"
description = "Label service for Nexus"
requires-python = ">=3.12,<3.15"
dependencies = [
    "e2b-code-interpreter>=2.4.1",
    "e2b<2.25.0",
    "fastapi>=0.121.3",
    "infra[rainbow]",
    "nexus-agent[otel]",
    "playwright>=1.57.0",
    "pyyaml>=6.0",
    "tencentcloud-sdk-python>=3.0.1388",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[project.scripts]
nexus-label = "label.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/label"]

[tool.uv.sources]
infra = { workspace = true }
nexus-agent = { workspace = true }
