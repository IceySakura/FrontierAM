[project]
name = "infra"
version = "0.1.0"
description = "Shared infrastructure components for Nexus services"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.121.3",
    "opentelemetry-api>=1.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rainbow = [
    "rainbow-cpp-sdk>=4.1.15",
]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra"]
