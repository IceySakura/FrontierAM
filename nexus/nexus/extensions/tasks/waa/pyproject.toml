[project]
name = "waa"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
host = [
    # Excel / table metrics
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "formulas>=1.2.0",
    # Text matching
    "rapidfuzz>=3.0.0",
    # Document metrics
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "odfpy>=1.4.0",
    # PDF
    "PyPDF2>=3.0.0",
    "PyMuPDF>=1.23.0",
    "borb>=2.1.0,<3.0.0",
    # Image / video / audio
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    "imagehash>=4.3.0",
    "librosa>=0.10.0",
    # Pin numba/llvmlite floors so the resolver doesn't fall back to the ancient
    # llvmlite 0.36.0 (no Python 3.13 wheel → fails to compile). librosa pulls
    # these in transitively via numba.
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    "fastdtw>=0.3.0",
    "pyacoustid>=1.3.0",
    # HTML / XML
    "beautifulsoup4>=4.12.0",
    "xmltodict>=0.13.0",
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    # Browser / runtime interaction
    "playwright>=1.40.0",
    # File handling
    "py7zr>=0.20.0",
    "LnkParse3>=1.4.0",
]
runtime = []

[tool.nexus]
tasks = { waa = "nexus.extensions.tasks.waa.task" }
