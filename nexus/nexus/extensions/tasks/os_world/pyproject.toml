[project]
name = "os_world"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
host = [
    "pygame>=2.6.1,<3",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "formulas>=1.2.0",
    "rapidfuzz>=3.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "odfpy>=1.4.0",
    "PyPDF2>=3.0.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.11.0",
    "borb>=2.1.0,<3.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
    "imagehash>=4.3.0",
    "librosa>=0.10.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    "fastdtw>=0.3.0",
    "pyacoustid>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "xmltodict>=0.13.0",
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "playwright>=1.40.0",
    "py7zr>=0.20.0",
    "PyYAML>=6.0.0",
    "tldextract>=5.0.0",
    "mutagen>=1.47.0",
    "easyocr>=1.7.0",
    "PyDrive>=1.3.1",
]
runtime = []

[tool.nexus]
run_parts = { osworld_native = "nexus.extensions.tasks.os_world.generators.run_parts" }
run_hooks = { osworld_run_dir = "nexus.extensions.tasks.os_world.execution.run_dir_hook", osworld_output_contract = "nexus.extensions.tasks.os_world.outputs" }

[tool.nexus.tools]
"desktop/computer_13" = "nexus.extensions.tools.desktop.tools"
"desktop/pyautogui" = "nexus.extensions.tools.desktop.tools"
"desktop/fixed_marker" = "nexus.extensions.tasks.os_world.execution.tools"

[tool.nexus.tasks]
"os_world" = "nexus.extensions.tasks.os_world.task"
