# AIHub 2.0 Taiji HY4 Preview LLM Profile
#
# 协议与路由：
#   Client=openai（Chat Completions）
#   Endpoint=http://api.aihub.woa.com/openapi/v2/chat/completions；Model=hy4-preview
#   Bearer 必须带 ?provider=taiji
#
# 推理配置：
#   reasoning_effort 默认 high，合法值 no_think / low / high。这是 chat.completions.create 的正式参数，放 request_args 顶层。
#
# 环境变量：
#   必填：HR_API_KEY
#   可选：
#       MAX_TOKENS
#       LLM_TIMEOUT
#       LLM_MAX_RETRIES
#
# 使用示例：
#   LLM_CONFIG=hy4-preview.openai
#
# curl 测试指令:
# curl -X POST 'http://api.aihub.woa.com/openapi/v2/chat/completions' \
#   -H "Authorization: Bearer ${HR_API_KEY}?provider=taiji" \
#   -H 'Content-Type: application/json' \
#   -d '{
#     "model": "hy4-preview",
#     "messages": [
#       {"role": "user", "content": "北京今天天气怎么样 (请深度思考后回答)"}
#     ],
#     "reasoning_effort": "high",
#     "prompt_cache_key": "hy4-preview-example",
#     "max_tokens": 4096,
#     "temperature": 0.9,
#     "top_p": 1.0,
#     "stream": false,
#     "response_format": {"type": "json_object"},
#     "tools": [
#       {"type": "function", "function": {
#         "name": "get_weather",
#         "description": "获取城市天气",
#         "parameters": {
#           "type": "object",
#           "properties": {
#             "city": {"type": "string", "description": "城市名"}},
#           "required": ["city"]}}}
#     ],
#     "tool_choice": "auto"
#   }'

body:
  imports:
    - nexus.extensions.openai_clients.openai

  agent_config:
    # hunyuan：推理以纯文本 / reasoning_content 出现，不是带签名的 Anthropic thinking block
    thinking_preset: hunyuan
    no_thinking_request_args:
      model: 'hy4-preview'
      max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,32768}}
      temperature: 1.0
      reasoning_effort: no_think
    extra_env:
      # Claude Code CLI 仍读 ANTHROPIC_MODEL；host 会改走 hy4-preview。默认值必须加引号
      ANTHROPIC_MODEL: 'claude-opus-4-8[1m]'

  openai_clients:
    main:
      name: openai
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}?provider=taiji'
          base_url: 'http://api.aihub.woa.com/openapi/v2'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,900}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,15}}
          # 不能放 log_llm_usage 或 cache_control_*：client_args 会原样喂给 AsyncOpenAI

        request_args:
          model: 'hy4-preview'
          temperature: 1.0
          top_p: 1.0
          max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,32768}}
          reasoning_effort: high
          extra_body:
            chat_template_kwargs:
              preserved_thinking: true
              interleaved_thinking: true

merge:
  imports: append_unique

source: aihub-hy4-preview-openai
