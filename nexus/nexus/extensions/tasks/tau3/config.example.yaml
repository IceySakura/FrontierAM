  #       wsid: "11644"
  #       url_pattern: "openapi"
  #       timeout: 120
  #       enable_thinking: false
  #     request_args:
  #       temperature: 0.7
  #       top_p: 1.0
  # user:
  #   name: "openai"
  #   config:
  #     client_args:
  #       api_key: "YOUR_API_KEY_HERE"
  #       base_url: "http://litellm-sgp.woa.com"
  #     request_args:
  #       model: "gpt-5.2"
  # eval:
