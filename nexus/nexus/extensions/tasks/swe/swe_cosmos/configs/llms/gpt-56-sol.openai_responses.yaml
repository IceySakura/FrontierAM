# AIHub 2.0 GPT-5.6 SOL LLM Profile
#
# 协议与路由：
#   Client=openai_responses（不是 chat 的 openai）
#   Endpoint=http://api.aihub.woa.com/standard/v1/responses
#   Model=gpt-5.6-sol；Bearer 不要带 ?provider=
#
# 推理配置：
#   reasoning.effort 默认 max；summary=detailed；mode=standard
#   store=false、include=[reasoning.encrypted_content]、max_output_tokens=128000
#
# 环境变量：
#   必填：HR_API_KEY
#   可选：
#       MAX_TOKENS
#       LLM_TIMEOUT
#       LLM_MAX_RETRIES
#       REASONING_EFFORT
#       REASONING_SUMMARY
#       REASONING_MODE
#
# 使用示例：
#   LLM_CONFIG=gpt-56-sol.openai_responses

body:
  imports:
    - nexus.extensions.openai_clients.openai_responses

  agent_config:
    # GPT-5.x Responses 自带原生 reasoning items，不必再从 plaintext reasoning_content 补造
    wrap_plaintext_reasoning_content: false

  openai_clients:
    main:
      name: openai_responses
      config:
        client_args:
          api_key: ${oc.env:HR_API_KEY}
          endpoint: 'http://api.aihub.woa.com/standard/v1/responses'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,12000}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,32}}
          capture_raw_io: true
          cache_task_id_from_run_id: true

        request_args:
          model: 'gpt-5.6-sol'
          store: false
          stream: false
          max_output_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
          # 给 agent_config.reasoning_effort 的 oc.select 用；client 会把它并进 reasoning.effort
          reasoning_effort: ${oc.env:REASONING_EFFORT,xhigh}
          reasoning:
            effort: ${oc.env:REASONING_EFFORT,xhigh}
            summary: ${oc.env:REASONING_SUMMARY,detailed}
            mode: ${oc.env:REASONING_MODE,standard}
          include:
            - reasoning.encrypted_content

merge:
  imports: append_unique

source: aihub2-gpt56-sol-openai-responses
