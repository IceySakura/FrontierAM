# AIHub 2.0 Claude Haiku 5.5 LLM Profile。
#
# 协议与路由：
#   Client=openai；Endpoint=http://api.aihub.woa.com/standard/v1/chat/completions；Model=claude-haiku-5-5；Bearer credential 携带 ?provider=aws_third 锁定 aws_third 通道
#
# 推理配置：
#   adaptive thinking、summarized display、effort=xhigh，并启用 Anthropic prompt cache 断点
#   thinking / output_config 放 extra_body，确保返回 summarized 思考文本而非空串（单传 reasoning_effort 时 display 默认 omitted 会导致思考文本为空）
#
# 环境变量：
#   必填：HR_API_KEY（添加 ?provider=aws_third 会设置服务商为 aws_third）
#   可选：
#    MAX_TOKENS
#    LLM_TIMEOUT
#    LLM_MAX_RETRIES
#    THINKING_TYPE
#    THINKING_EFFORT
#    CACHE_CONTROL_ENABLED
#    CACHE_CONTROL_STRATEGY
#
# 使用示例：
#   LLM_CONFIG=claude-haiku-55.openai
#
# curl 测试指令:
# curl -X POST 'http://api.aihub.woa.com/standard/v1/chat/completions' \
#   -H "Authorization: Bearer ${HR_API_KEY}" \
#   -H 'Content-Type: application/json' \
#   -d '{
#     "model": "claude-haiku-5-5",
#     "max_completion_tokens": 12800,
#     "reasoning_effort": "xhigh",
#     "stream": false,
#     "messages": [
#       {"role": "user", "content": "用一句话解释什么是分布式锁"}
#     ]
#   }'

body:
  imports:
    - nexus.extensions.openai_clients.openai

  agent_config:
    thinking_preset: bedrock-claude
    no_thinking_request_args:
      model: 'claude-haiku-5-5'
      max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
    extra_env:
      # Claude Code CLI 读 ANTHROPIC_MODEL 决定 1M 窗口与思考能力，host 会改走 claude-haiku-5-5（不能含 haiku 字样，否则 anthropic_proxy 会把主请求误判为轻量旁路请求）
      ANTHROPIC_MODEL: 'claude-opus-5[1m]'

  openai_clients:
    main:
      name: openai
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}?provider=aws_third'
          base_url: 'http://api.aihub.woa.com/standard/v1'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,900}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,15}}
          cache_control_enabled: ${oc.decode:${oc.env:CACHE_CONTROL_ENABLED,true}}
          cache_control_strategy: ${oc.env:CACHE_CONTROL_STRATEGY,claude_code}
          # 不能放 log_llm_usage：client_args 会原样喂给 AsyncOpenAI，它的构造函数不认这个 key

        request_args:
          model: 'claude-haiku-5-5'
          max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
          # AsyncOpenAI 的 chat.completions.create 是显式签名，多余的顶层字段会抛 TypeError；extra_body 会被原样并进请求 JSON，于是 Anthropic 专有字段走这里。
          extra_body:
            thinking:
              # 可选: adaptive, enabled, disabled
              type: ${oc.env:THINKING_TYPE,adaptive}
              display: summarized
            output_config:
              effort: ${oc.env:THINKING_EFFORT,xhigh}

        # 脚手架可以在请求里自带 temperature，且会覆盖上面的 request_args。上面开了 thinking，而 Anthropic 此时只接受 temperature=1
        enforced_request_args:
          temperature: 1

merge:
  imports: append_unique

source: aihub2-haiku55-openai
