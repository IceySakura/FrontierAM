# 潮汐资源 HY3 Offline LLM Profile
#
# 协议与路由：
#   Client=openai（Chat Completions）
#   Endpoint=http://api.taiji.woa.com/openapi/inner/v2/chat/completions；Model=hy3-offline
#   Bearer 用专门申请的 OPENAI_API_KEY
#
# 环境变量：
#   必填：OPENAI_API_KEY
#   可选：
#       MAX_TOKENS
#       LLM_TIMEOUT
#       LLM_MAX_RETRIES
#       REASONING_EFFORT
#
# 使用示例：
#   LLM_CONFIG=hy3-offline.openai
#
# curl 测试指令:
# curl -X POST 'http://api.taiji.woa.com/openapi/inner/v2/chat/completions' \
#   -H "Content-Type: application/json" \
#   -H "Authorization: Bearer $OPENAI_API_KEY" \
#   -d '{
#   "model": "hy3-offline",
#   "reasoning_effort": "high",
#   "messages": [
#     {
#       "role": "user",
#       "content": "北京今天天气怎么样 (请深度思考后回答)"
#     }
#   ],
#   "tools": [
#     {
#       "type": "function",
#       "function": {
#         "name": "get_weather",
#         "description": "获取指定城市的天气",
#         "parameters": {
#           "type": "object",
#           "properties": {
#             "city": {
#               "type": "string",
#               "description": "城市名称"
#             }
#           },
#           "required": ["city"]
#         }
#       }
#     }
#   ],
#   "tool_choice": "auto"
# }'

body:
  imports:
    - nexus.extensions.openai_clients.openai

  agent_config:
    # hunyuan：推理以纯文本 / content 里的 think 标签出现，不是带签名的 Anthropic thinking block
    thinking_preset: hunyuan
    extra_env:
      ANTHROPIC_MODEL: hy3-offline

  openai_clients:
    main:
      name: openai
      config:
        client_args:
          api_key: ${oc.env:OPENAI_API_KEY,''}
          # AsyncOpenAI 会在这个 base 后拼 /chat/completions
          base_url: 'http://api.taiji.woa.com/openapi/inner/v2'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,900}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,15}}
          # 不能放 log_llm_usage 或 cache_control_*：client_args 会原样喂给 AsyncOpenAI

        request_args:
          model: 'hy3-offline'
          temperature: 1.0
          top_p: 1.0
          max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,32768}}
          reasoning_effort: high
          extra_body:
            chat_template_kwargs:
              preserved_thinking: true
              interleaved_thinking: true

merge:
  imports: append_unique

source: taiji-hy3-offline-openai
