# DSH Agent Profile（DeepSeek Harness，仅 ACP；模型走 Host OpenAI 兼容代理）
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_VERSION
#       AGENT_WORKING_DIR
#       AGENT_TIMEOUT
#       AGENT_MAX_ITERATIONS
#       AGENT_MAX_OUTPUT_TOKENS
#       AGENT_CONTEXT_WINDOW
#
# 使用示例：
#   AGENT_CONFIG=dsh
#
# 组合约束：
#   agents/ 下的 Profile 互斥，同一次运行只选择一个

body:
  imports:
    - nexus.extensions.agents.dsh
  agent_name: dsh

  agent_config:
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    version: ${oc.env:AGENT_VERSION,0.1.0-rc.6}
    acp_version: ${oc.env:AGENT_VERSION,0.1.0-rc.6}
    npm_registry: 'http://mirrors.tencent.com/npm/'
    max_turns: ${oc.decode:${oc.env:AGENT_MAX_ITERATIONS,20}}
    permission_mode: workspace-write
    permission_policy: allow
    context_window: ${oc.decode:${oc.env:AGENT_CONTEXT_WINDOW,200000}}
    max_output_tokens: ${oc.decode:${oc.env:AGENT_MAX_OUTPUT_TOKENS,32768}}
    transcript_timeout: 120.0
    record_trace_events: true
    extra_env:
      AWS_EC2_METADATA_DISABLED: 'true'

merge:
  imports: append_unique

source: dsh
