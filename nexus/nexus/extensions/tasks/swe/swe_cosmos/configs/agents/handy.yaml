# Handy Agent Profile
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_VERSION
#       AGENT_WORKING_DIR
#       AGENT_TIMEOUT
#       AGENT_MAX_OUTPUT_TOKENS
#       HAIKU_MODEL
#
# 使用示例：
#   AGENT_CONFIG=handy
#
# 组合约束：
#   agents/ 下的 Profile 互斥，同一次运行只选择一个

body:
  imports:
    - nexus.extensions.agents.handy
  agent_name: handy

  agent_config:
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    version: ${oc.env:AGENT_VERSION,0.1.14}
    npm_registry: 'http://mirrors.tencent.com/npm/'
    model: ${oc.select:openai_clients.main.config.request_args.model,null}
    max_output_tokens: ${oc.decode:${oc.env:AGENT_MAX_OUTPUT_TOKENS,64000}}
    collect_artifacts: false
    extra_env:
      AWS_EC2_METADATA_DISABLED: 'true'
    haiku_model: ${oc.env:HAIKU_MODEL,${oc.select:openai_clients.main.config.request_args.model,null}}

merge:
  imports: append_unique

source: handy
