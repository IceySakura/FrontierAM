# Mini SWE-Agent Profile
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_MAX_ITERATIONS
#
# 使用示例：
#   AGENT_CONFIG=mini_swe_agent

body:
  imports:
    - nexus.extensions.agents.mini_swe_agent
  agent_name: mini_swe_agent

  agent_config:
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型。
    max_iterations: ${oc.decode:${oc.env:AGENT_MAX_ITERATIONS,500}}

merge:
  imports: append_unique

source: mini-swe-agent
