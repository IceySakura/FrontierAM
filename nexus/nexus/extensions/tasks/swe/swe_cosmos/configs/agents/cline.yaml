# Cline Agent Profile
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_VERSION
#       AGENT_WORKING_DIR
#       AGENT_TIMEOUT
#
# 使用示例：
#   AGENT_CONFIG=cline
#
# 组合约束：
#   agents/ 下的 Profile 互斥，同一次运行只选择一个

body:
  imports:
    - nexus.extensions.agents.cline
  agent_name: cline

  agent_config:
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    version: ${oc.env:AGENT_VERSION,3.0.62}
    npm_registry: 'http://mirrors.tencent.com/npm/'
    # 只当开关用：>0 才会给 CLI 加 --reasoning-effort，具体档位由 runtime 侧 OPENAI_REASONING_EFFORT 决定（默认 high）
    thinking_budget_tokens: 1
    extra_env:
      AWS_EC2_METADATA_DISABLED: 'true'

merge:
  imports: append_unique

source: cline
