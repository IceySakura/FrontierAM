# CodeAct Agent Profile
#
# 与 swe_agent 的区别：
#   工具集固定为 terminal / file_editor / task_tracker / think / finish，
#   working_dir 和 problem_statement 从 task_config 读，不走 agent_config
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_MAX_ITERATIONS
#       AGENT_TOOL_ERROR_RETRY
#
# 使用示例：
#   AGENT_CONFIG=codeact
#
# 组合约束：
#   agents/ 下的 Profile 互斥，同一次运行只选择一个

body:
  imports:
    - nexus.extensions.agents.codeact
  agent_name: codeact

  agent_config:
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型
    max_iterations: ${oc.decode:${oc.env:AGENT_MAX_ITERATIONS,500}}
    # 模型没给出 tool_call、或 arguments 不是合法 JSON 时的重试次数；0 表示首次出错即判失败。
    completion_retry_on_tool_error: ${oc.decode:${oc.env:AGENT_TOOL_ERROR_RETRY,0}}

merge:
  imports: append_unique

source: codeact
