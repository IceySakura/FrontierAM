# Kilo Agent Profile
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_VERSION
#       AGENT_WORKING_DIR
#       AGENT_TIMEOUT
#       NPM_REGISTRY
#
# 使用示例：
#   AGENT_CONFIG=kilo

body:
  imports:
    - nexus.extensions.agents.kilo
  agent_name: kilo

  agent_config:
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型。
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    version: ${oc.env:AGENT_VERSION,7.3.0}
    npm_registry: ${oc.env:NPM_REGISTRY,http://mirrors.tencent.com/npm/}

merge:
  imports: append_unique

source: kilo
