[project]
name = "yb_one_agent"
version = "3.0"
authors = [
    { name = "jimcjhe" },
    { name = "yonewu" },
    { name = "chrisjxu" },
    { name = "zayneguo" },
]
dependencies = []

[project.optional-dependencies]
host = [
    "beautifulsoup4>=4.12",
    "fastmcp>=3.2.4",
    "httpcore>=1.0.9",
    "httpx>=0.27",
    "jinja2>=3.0",
    "requests>=2.33.1",
    "cos-python-sdk-v5>=1.9.42",
]
runtime = []

[tool.nexus]
agents = { yb_one_agent = "nexus.extensions.agents.yb_one_agent.agent" }

[tool.nexus.tools]
"yb_one_agent/bash_v2" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/read_v2" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/edit_v2" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/write_v2" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/bash" = "nexus.extensions.agents.yb_one_agent.tool"
"yb_one_agent/read" = "nexus.extensions.agents.yb_one_agent.tool"
"yb_one_agent/edit" = "nexus.extensions.agents.yb_one_agent.tool"
"yb_one_agent/write" = "nexus.extensions.agents.yb_one_agent.tool"
"yb_one_agent/web_fetch" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/web_search" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/picture_search" = "nexus.extensions.agents.yb_one_agent.tools"
"yb_one_agent/video_search" = "nexus.extensions.agents.yb_one_agent.tools"
