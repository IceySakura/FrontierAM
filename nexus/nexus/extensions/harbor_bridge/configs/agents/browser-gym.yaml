# BrowserGym Agent Profile。
#
# 用途：
#   使用 BrowserGym 操作网页，并将 Agent 完成后的同一浏览器会话交给 Verifier 检查。
#
# 适用任务：
#   声明 [environment.browser] 且 verifier.environment_mode="shared" 的 WebGUI 任务。
#
# Harbor 运行时注入：
#   user_prompt、timeout 和 browser 声明。ctx.tool_state 没有现成 session 时，Agent 会
#   创建 session、打开 start_url，并把 live session ID 传给 shared Verifier。
#
# 环境变量：
#   必填：无。
#   可选：无。
#
# 使用示例：
#   nexus run batch ... \
#     --use nexus/extensions/harbor_bridge/configs/agents/browser-gym.yaml

body:
  imports:
    - nexus.extensions.agents.browser_gym
  agent_name: browser_gym_agent

  agent_config:
    # 与原生 custom_web 批次保持一致；其它观察和压缩参数使用 Agent 默认值。
    max_iterations: 30

merge:
  imports: append_unique

source: harbor-browser-gym
