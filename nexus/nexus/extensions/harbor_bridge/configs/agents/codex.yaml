# Codex Agent Profile。
#
# 用途：
#   在任务 Runtime 中安装并运行 Codex CLI，通过 ResponsesProxy 完成代码检索、修改、
#   命令执行和仓库级自主任务。
#
# 适用任务：
#   通用 CodeAgent、Cyber、SRE、代码修复和需要 Codex JSON trace 的 Harbor Batch。
#
# Harbor 运行时注入：
#   user_prompt、working_dir 和 timeout。model 默认引用最终 LLM Profile 的主模型；
#   mode=exec_json 时会重建 termination reason 和有序工具调用 timeline。
#
# 环境变量：
#   必填：无。
#   可选：CODEX_VERSION、CODEX_NPM_REGISTRY、CODEX_TIMEOUT、AGENT_WORKING_DIR。
#
# 使用示例：
#   nexus run batch ... \
#     --use nexus/extensions/harbor_bridge/configs/agents/codex.yaml

body:
  imports:
    - nexus.extensions.agents.codex
  agent_name: codex

  agent_config:
    # Codex npm 包版本；生产复现建议固定版本。
    version: ${oc.env:CODEX_VERSION,0.114.0}
    # Codex npm 安装源。
    npm_registry: ${oc.env:CODEX_NPM_REGISTRY,http://mirrors.tencent.com/npm/}
    # 可选二进制直装地址。 null 表示使用 npm；设置后会绕过 npm 安装。
    binary_url: null
    # binary_url 文件的可选 SHA-256。 使用自定义二进制时建议同时设置。
    binary_checksum: null
    # 非 Harbor 场景的默认超时；Harbor Task 会用 [agent].timeout_sec 覆盖。
    timeout: ${oc.env:CODEX_TIMEOUT,7200}
    # 非 Harbor 场景的默认工作目录；Harbor Task 会用 environment.workdir 覆盖。
    working_dir: ${oc.env:AGENT_WORKING_DIR,/app}
    # 默认读取最终 LLM Profile 的主模型，避免 Agent/LLM 配置漂移。
    model: ${oc.select:openai_clients.main.config.request_args.model,null}
    # 可选模型目录、上下文窗口和推理强度；默认交给 Codex。
    model_catalog_json: null
    # 可选运行时模型目录条目覆盖；设置后按 model 克隆并修改内置条目。
    model_catalog_overrides: null
    model_context_window: null
    reasoning_effort: null
    # 可选开发者指令，会放在用户任务之前。
    developer_instructions: null
    # 追加到 Codex config.toml 的高级配置。
    extra_config_toml: null
    # 运行时本地文件，内容作为模型的基础指令（codex 根配置键 model_instructions_file）。
    # null 表示使用 CLI 内置指令。
    model_instructions_file: null
    # null 表示根据 Codex CLI 版本自动选择 freeform apply_patch。
    experimental_use_freeform_apply_patch: null
    # 保留 encrypted_content reasoning item ID；明文 reasoning 模型可覆盖为 false。
    use_azure_provider: true
    # 把明文 reasoning_content 包装成 reasoning item，保持 HY3/GLM 可回放；
    # GPT 系任务在实验 input 中覆盖为 false。
    wrap_plaintext_reasoning_content: true
    # null 使用 converter 默认行为，关闭 tool reference 扩展；true 启用 deferred schema。
    supports_tool_references: null
    # HY4 文本模板使用 tool_reference；serving/VLM 模板改用 tool_search_output。
    # 非默认格式需要同时设置 supports_tool_references=true。
    tool_search_output_format: tool_reference
    # Codex 自动压缩阈值；null 表示完全使用 Codex 默认值。
    auto_compact_token_limit: 272000
    # 可选自动压缩计数范围和本地压缩提示词。
    auto_compact_token_limit_scope: null
    compact_prompt: null
    # 输出 Codex JSONL 事件并重建 termination/timeline。
    mode: exec_json
    # 仅 app_server 模式支持原生 Goal；默认关闭，不限制 Goal token 预算。
    goal_mode: false
    goal_token_budget: null
    # 可选稳定 CODEX_HOME 名称；null 保持每次运行使用独立 UUID。
    codex_home_name: null
    # 可选 Runtime 侧日志与原生 session 导出目录（仅 Linux）。null 表示不导出（session 照常写入
    # 每次运行独立的 CODEX_HOME）。Harbor Bridge 通过自身 trajectory/handoff 机制判分，不依赖该字段。
    logs_dir: null
    # 仅用于确定性 parity 测试；生产默认保留真实 chunk ID 和耗时。
    normalize_exec_command_metadata: false
    # 工具参数可能较大或敏感，默认不写入 timeline。
    timeline_collect_tool_args: false
    # 原始 JSONL 可能很大，默认不保留在 AgentOutput。
    retain_json_events_stdout: false
    # 追加到 codex exec 的 CLI 参数。
    extra_cli_args: []
    # 通过 `codex exec -i` 附加到首轮提示的 Runtime 本地图片路径。
    # 由 Task 在运行时按样本注入，因此通用 Profile 保持为空。
    images: []
    # 注入 Codex 进程的额外环境变量；MCP 自身的 env 在 mcp_servers 中配置。
    extra_env: null
    # stdio MCP Server 列表，字段与 codex_native_bridge 一致。
    # Harbor task.toml 声明的 MCP 在运行时传入，因此通用 Profile 保持为空。
    mcp_servers: []

merge:
  imports: append_unique

source: harbor-codex
