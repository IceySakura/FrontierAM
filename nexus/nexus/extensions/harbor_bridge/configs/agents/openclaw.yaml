# OpenClaw Agent Profile。
#
# 用途：
#   在任务 Runtime 中安装并运行 OpenClaw CLI，通过 OpenAI-compatible Proxy 完成自主任务。
#
# 适用任务：
#   需要 OpenClaw 工具循环、Web 能力或 OpenClaw transcript 的无人值守 Harbor Batch。
#
# Harbor 运行时注入：
#   user_prompt、working_dir 和 timeout。Verifier trajectory 优先读取 OpenClaw transcript；
#   needs_agent_trajectory=true 时 Compiler 会安装专用 ChatTracker fallback。本 Profile
#   不启用普通 ChatTracker，也不恢复或导出私有 reasoning。
#
# 环境变量：
#   必填：无。
#   可选：OPENCLAW_VERSION、OPENCLAW_NPM_REGISTRY、OPENCLAW_CONTEXT_WINDOW、
#         OPENCLAW_MAX_TOKENS、OPENCLAW_LLM_IDLE_TIMEOUT_MS、OPENCLAW_ONBOARD_TIMEOUT、
#         OPENCLAW_SUPPORTS_IMAGES、OPENCLAW_TIMEOUT、AGENT_WORKING_DIR。
#
# 使用示例：
#   nexus run batch ... \
#     --use nexus/extensions/harbor_bridge/configs/agents/openclaw.yaml

body:
  imports:
    - nexus.extensions.agents.openclaw
  agent_name: openclaw

  agent_config:
    # 固定版本保证同一批评测可复现；需要升级时通过环境变量显式覆盖。
    version: ${oc.env:OPENCLAW_VERSION,2026.6.5}
    # 与 installed-agent 运行时默认值一致；外部环境可切换到其它可达 registry。
    npm_registry: ${oc.env:OPENCLAW_NPM_REGISTRY,http://mirrors.tencent.com/npm/}
    context_window: ${oc.env:OPENCLAW_CONTEXT_WINDOW,200000}
    max_tokens: ${oc.env:OPENCLAW_MAX_TOKENS,65536}
    llm_idle_timeout_ms: ${oc.env:OPENCLAW_LLM_IDLE_TIMEOUT_MS,600000}
    onboard_timeout: ${oc.env:OPENCLAW_ONBOARD_TIMEOUT,900}
    supports_images: ${oc.env:OPENCLAW_SUPPORTS_IMAGES,false}
    # 留空时从最终 openai_clients.main 的 request_args.model 读取，避免与 LLM Profile 漂移。
    model: null
    working_dir: ${oc.env:AGENT_WORKING_DIR,/tmp_workspace}
    timeout: ${oc.env:OPENCLAW_TIMEOUT,7200}

merge:
  imports: append_unique

source: harbor-openclaw
