# AIHub Taiji HY3 LiteLLM LLM Profile。
#
# 用途：
#   通过 AIHub OpenAI-compatible 接口和 LiteLLM 调用 HY3，主要用于与 infer_proxy 版本
#   对照，以及 CC Search White-box 原生链路。
#
# 协议与路由：
#   Client=litellm；Endpoint=http://llm-api.model-eval.woa.com/v1/chat/completions；
#   Model=openai/api_taiji_hy3。与 aihub-hy3.yaml 不同，本文件通过
#   extra_body.chat_template_kwargs 传递 thinking 参数。
#
# 推理配置：
#   temperature=0.9、max_tokens=32768、thinking=true、reasoning_effort 默认 high。
#
# 环境变量：
#   必填：OPENAI_API_KEY。
#   可选：OPENAI_BASE_URL、OPENAI_MODEL、MAIN_REASONING_EFFORT。
#
# 使用示例：
#   nexus run batch ... \
#     --use nexus/extensions/harbor_bridge/configs/llm/aihub-hy3-litellm.yaml
#
# 组合约束：
#   llm/ 下的 Profile 互斥，同一次运行只选择一个。确定性评测可覆盖 temperature=0。

body:
  imports:
    - nexus.extensions.openai_clients.litellm

  openai_clients:
    main:
      name: litellm
      config:
        client_args:
          # 执行前从环境变量读取，APP ID/Key 不进入 Batch DB。
          api_key__env: OPENAI_API_KEY
          base_url: ${oc.env:OPENAI_BASE_URL,http://llm-api.model-eval.woa.com/v1}
          # client_args 没有类型强转，数值写字面量。
          max_retries: 10
          # 在 Runtime 日志中记录 input/output token usage，不记录密钥。
          log_llm_usage: true
          # 不设置 cache_control_*：HY3 不是 Claude，无 Anthropic cache_control 语义。

        request_args:
          model: ${oc.env:OPENAI_MODEL,openai/api_taiji_hy3}
          # request_args 不做类型强转，所以写 YAML 字面量而不是 ${oc.env:...}——后者
          # 会把 0.9 传成字符串。需要按批改用 --set，它会按 YAML 解析出真正的浮点数。
          temperature: 0.9
          # 单次请求的输出上限，取自旧 search 链路的代码默认
          # （tasks/search 的 _env_int('SEARCH_MAX_TOKENS', 32768)，恒发）。
          # 这是每次请求的生成上限，不是上下文窗口，也不是整条轨迹的预算；HY3 开着
          # thinking，思考 token 同样占这个额度，给小了会在思考中途截断 tool call。
          # 另一条参考链路 tasks/toolathlon_gym 不发这个字段，这里统一按 search 来。
          max_tokens: 32768
          extra_body:
            chat_template_kwargs:
              # 合法值 no_think / low / high。
              reasoning_effort: ${oc.env:MAIN_REASONING_EFFORT,high}
              # extra_body 直接透传给网关，没有类型强转：布尔必须写字面量，
              # 写成 ${oc.env:...} 会变成字符串 'false' 而被当成 True。
              thinking: true
        # Harbor 明确固定输出预算；普通 request_args 仍是可覆盖的默认值。
        enforced_request_args:
          max_tokens: ${oc.select:openai_clients.main.config.request_args.max_tokens,null}

merge:
  imports: append_unique

source: harbor-aihub-hy3-litellm
