# Infer-Prod HY4 LLM Profile。
#
# 用途：
#   通过 Polaris infer-proxy 的 OpenAI-compatible 接口调用自部署 HY4 长上下文模型。
#
# 协议与路由：
#   Client=litellm；Endpoint=http://infer-proxy-yb-test.production.polaris:8000/openapi；
#   Model=openai/${INFER_PROD_HY4_MODEL}，并启用按 run_id 派生的会话亲和。
#
# 推理配置：
#   temperature=1、top_p=1、preserved/interleaved thinking；reasoning_effort 默认 high，
#   max_tokens 默认 262144，no-thinking 路由显式使用 no_think。
#
# 环境变量：
#   必填：OPENAI_API_KEY、INFER_PROD_HY4_MODEL；无鉴权环境可将 OPENAI_API_KEY 设为 EMPTY。
#   可选：INFER_PROD_HY4_BASE_URL、INFER_PROD_HY4_REASONING_EFFORT、
#         INFER_PROD_HY4_MAX_TOKENS、INFER_PROD_HY4_TIMEOUT。
#
# 使用示例：
#   nexus run batch ... \
#     --use nexus/extensions/harbor_bridge/configs/llm/infer-prod-hy4.yaml
#
# 组合约束：
#   llm/ 下的 Profile 互斥，同一次运行只选择一个。

body:
  imports:
    - nexus.extensions.openai_clients.litellm

  # HY4 exposes flat reasoning_content through an OpenAI-compatible response.
  agent_config:
    thinking_preset: hunyuan
    no_thinking_request_args:
      model: openai/${oc.env:INFER_PROD_HY4_MODEL}
      max_tokens: ${oc.decode:${oc.env:INFER_PROD_HY4_MAX_TOKENS,262144}}
      temperature: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: no_think
          preserved_thinking: false
    haiku_model: null
    extra_env:
      # Keep Claude Code on its long-context Opus-compatible prompt path.
      ANTHROPIC_MODEL: claude-opus-4-7[1m]
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${oc.env:INFER_PROD_HY4_MAX_TOKENS,262144}

  openai_clients:
    main:
      name: litellm
      config:
        client_args:
          # Resolved immediately before execution, so future real keys do not enter the Batch DB.
          api_key__env: OPENAI_API_KEY
          base_url: ${oc.env:INFER_PROD_HY4_BASE_URL,http://infer-proxy-yb-test.production.polaris:8000/openapi}
          # One complete HY4 generation may be very long; default to one hour.
          timeout: ${oc.decode:${oc.env:INFER_PROD_HY4_TIMEOUT,3600}}
          max_retries: 15
          log_llm_usage: true
          # Runner derives a stable per-task 32-char ID from run_id + model.
          # LiteLLMClient sends it directly as SessionID/StrategyType headers.
          nexus_trace_id_from_run_id: true
          nexus_llm_lb_strategy: ConsistentHash

        request_args:
          # LiteLLM requires the openai/ provider prefix; the gateway receives the bare model name.
          model: openai/${oc.env:INFER_PROD_HY4_MODEL}
          temperature: 1.0
          top_p: 1.0
          max_tokens: ${oc.decode:${oc.env:INFER_PROD_HY4_MAX_TOKENS,262144}}
          extra_body:
            chat_template_kwargs:
              reasoning_effort: ${oc.env:INFER_PROD_HY4_REASONING_EFFORT,high}
              preserved_thinking: true
              interleaved_thinking: true
        # Harbor 明确固定输出预算；普通 request_args 仍是可覆盖的默认值。
        enforced_request_args:
          max_tokens: ${oc.select:openai_clients.main.config.request_args.max_tokens,null}

merge:
  imports: append_unique

source: harbor-infer-prod-hy4
