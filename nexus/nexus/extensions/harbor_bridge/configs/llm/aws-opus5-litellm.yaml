# AWS Bedrock Claude Opus 5 LLM Profile。
#
# 用途：
#   通过 Polaris passthrough 和 LiteLLM 的 Bedrock Invoke adapter 调用 Claude Opus 5。
#
# 协议与路由：
#   Client=litellm；Endpoint=http://trpc-gpt-eval.production.polaris:8080；
#   Model=bedrock/invoke/anthropic.claude-opus-5；强制使用 Invoke，避免回落到 Converse。
#
# 推理配置：
#   adaptive thinking、summarized display、effort=max、max_tokens=128000，并启用 prompt cache。
#
# 环境变量：
#   必填：OPENAI_API_KEY，值需包含 provider=aws_third、model=anthropic.claude-opus-5
#         和足够长的 timeout。
#   可选：AWS_OPUS5_BASE_URL、AWS_OPUS5_MODEL。
#
# 使用示例：
#   nexus run batch ... \
#     --use nexus/extensions/harbor_bridge/configs/llm/aws-opus5-litellm.yaml
#
# 组合约束：
#   llm/ 下的 Profile 互斥，同一次运行只选择一个。

# body 是合并进最终 RunInput 的部分配置。
body:
  # 导入后注册 litellm OpenAI-compatible Client。
  imports:
    - nexus.extensions.openai_clients.litellm

  agent_config:
    thinking_preset: bedrock-claude
    extra_env:
      ANTHROPIC_MODEL: claude-opus-5

  # OpenAI Client 可以有多个命名实例；Agent 默认使用 main。
  openai_clients:
    main:
      # Registry 中的 Client 名称。
      name: litellm
      # config 分为 Client 初始化参数和每次模型请求参数。
      config:
        client_args:
          # 执行前读取 Polaris 鉴权串，避免 APP ID/Key 明文写入 Batch DB。
          # Polaris 原生 Invoke 路由要求鉴权 query 与请求模型一致，因此必须同时带
          # provider=aws_third 和 model=anthropic.claude-opus-5。
          api_key__env: OPENAI_API_KEY
          # Polaris passthrough 网关地址（注意：不带 /v1）。 LiteLLM 的 bedrock
          # provider 会把它当 api_base 覆盖 AWS 官方地址，用 Bearer 鉴权。
          base_url: ${oc.env:AWS_OPUS5_BASE_URL,http://trpc-gpt-eval.production.polaris:8080}
          # LiteLLM 调用失败后的最大重试次数。
          max_retries: 3
          timeout: 3660
          # 在 Runtime 日志中记录 input/output/cache token usage，不记录密钥。
          log_llm_usage: true
          # 向支持 Anthropic cache_control 的请求写入 ephemeral cache marker。
          cache_control_enabled: true
          # Nexus 通用策略会把 cache marker 放在最新的可缓存 user/tool 消息上，
          # LiteLLM 再转换成 Bedrock Anthropic Invoke 请求的 cache_control。
          cache_control_strategy: default
          # 只标记最新的 user/tool 消息，与原 Opus 5 专用 helper 行为一致。
          cache_control_last_n_messages: 1
          # Compose 完成后由 Runner 以 run_id + model 派生稳定 cache_task_id；
          # 该控制字段会在创建 LiteLLM Client 前移除，不会传给网关。
          cache_task_id_from_run_id: true
        # 每次 completion 的默认参数；Agent 单次调用参数仍可覆盖它们。
        request_args:
          # 显式 invoke/ 防止 LiteLLM 根据消息形状回落到 Converse；鉴权 query
          # 仍使用网关要求的原生模型名 anthropic.claude-opus-5。
          model: ${oc.env:AWS_OPUS5_MODEL,bedrock/invoke/anthropic.claude-opus-5}
          # 单次最大输出 token；Bedrock Opus 5 上限为 128000。
          max_tokens: 128000
          # Bedrock Claude thinking 配置。 adaptive 让模型按问题动态使用推理预算。
          # 本机翻译路线下 thinking 作为顶层 request_args 传入，无需
          # extra_body / allowed_openai_params 放行。
          thinking:
            type: adaptive
            # summarized 返回摘要推理；省略或关闭会改变轨迹中 thinking 的可见性。
            display: summarized
          # Bedrock 输出配置。 max 请求最高推理强度（本 Profile 实测可用）。
          output_config:
            effort: max
        # 只有显式 policy 才覆盖 Claude Code 自带的输出预算。
        enforced_request_args:
          max_tokens: ${oc.select:openai_clients.main.config.request_args.max_tokens,null}

# imports 是列表，append_unique 表示保留已有模块并去重追加，而不是整体覆盖。
merge:
  imports: append_unique

# source 只用于 Compose 日志、错误定位和审计，不进入 RunInput。
source: harbor-aws-opus5-litellm
