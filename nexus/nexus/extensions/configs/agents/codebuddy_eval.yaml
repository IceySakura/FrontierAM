# CodeBuddy Agent Profile
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_VERSION
#       AGENT_WORKING_DIR
#       AGENT_TIMEOUT
#       NPM_REGISTRY
#
# 使用示例：
#   AGENT_CONFIG=codebuddy_eval

body:
  imports:
    - nexus.extensions.agents.codebuddy
  agent_name: codebuddy

  agent_config:
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型。
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    version: ${oc.env:AGENT_VERSION,2.151.0}
    npm_registry: ${oc.env:NPM_REGISTRY,http://mirrors.tencent.com/npm/}
    # 无人值守：不让 agent 向用户提问。字段来自 ad8feb9612（A 的 scaffold_agent 一直在用）。
    prompt_suffix: 'This is an unattended run. Never ask the user questions; if something is unclear or blocked, pick a reasonable default and keep going.'

  # What this scaffold does with each model family. The llm file states the facts,
  # this file decides which of them it uses. Families it says nothing about get nothing.
  agent_config_by_llm:
    claude:
      extra_env:
        ANTHROPIC_MODEL: '${llm:anthropic_model}'
    hunyuan:
      extra_env:
        ANTHROPIC_MODEL: '${llm:anthropic_model}'

merge:
  imports: append_unique

source: codebuddy
