# Mini SWE-Agent Profile
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_MAX_ITERATIONS
#       AGENT_TIMEOUT          # 墙钟上限（秒），不设 = 0 = 不限时
#
# 使用示例：
#   AGENT_CONFIG=mini_swe_agent

body:
  imports:
    - nexus.extensions.agents.mini_swe_agent
  agent_name: mini_swe_agent

  agent_config:
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型。
    max_iterations: ${oc.decode:${oc.env:AGENT_MAX_ITERATIONS,500}}
    # mini 的时限字段叫 wall_time_limit_seconds，不叫 timeout；不接上的话设了 AGENT_TIMEOUT 也不生效。
    # 生产 rollout 给 mini 设的是 12000（swe/prod/buses/1010/rollout/launch_cell.sh）。
    wall_time_limit_seconds: ${oc.decode:${oc.env:AGENT_TIMEOUT,0}}

  # What this scaffold does with each model family. The llm file states the facts,
  # this file decides which of them it uses. Families it says nothing about get nothing.
  agent_config_by_llm:
    claude:
      extra_env:
        ANTHROPIC_MODEL: '${llm:anthropic_model}'
    hunyuan:
      extra_env:
        ANTHROPIC_MODEL: '${llm:anthropic_model}'

merge:
  imports: append_unique

source: mini-swe-agent
