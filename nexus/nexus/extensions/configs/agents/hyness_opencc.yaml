# Hyness OpenCC profile. This selects Hyness's OpenCC App, not the HyCode binary.
# The App declares an exact dependency on this engine; their version numbers differ.

body:
  imports:
    - nexus.extensions.agents.hyness
  agent_name: hyness
  agent_config:
    packages: ${oc.decode:${oc.env:HYNESS_PACKAGES,'["@tencent/hyness@0.0.1-alpha.20261020123306","@tencent/hyness-opencc@0.2.1-alpha.20261020.1"]'}}
    app_config: ${oc.env:HYNESS_APP_CONFIG,@tencent/hyness-opencc/apps/opencc/app.yaml}
    # Decode after merge: a YAML null would delete the key and restore the input default.
    app_config_overlay: ${oc.decode:${oc.env:HYNESS_APP_CONFIG_OVERLAY,@tencent/hyness-opencc/apps/opencc/overlays/training.yaml}}
    harness_id: ${oc.decode:${oc.env:HYNESS_HARNESS_ID,opencc}}
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    max_turns: ${oc.decode:${oc.env:AGENT_MAX_TURNS,600}}
    npm_registry: ${oc.env:NPM_REGISTRY,https://mirrors.tencent.com/npm/}
    stop_on_tool_error: ${oc.decode:${oc.env:HYNESS_STOP_ON_TOOL_ERROR,false}}
    extra_cli_args:
      - --setting-sources
      - user
      - --disallowedTools
      - WebSearch,WebFetch,NotebookEdit,AskUserQuestion,EnterPlanMode,ExitPlanMode
    extra_env:
      CLAUDE_CODE_ATTRIBUTION_HEADER: '0'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
      ENABLE_TOOL_SEARCH: 'false'
      DISABLE_AUTO_COMPACT: '1'
      DISABLE_COMPACT: '1'

  agent_config_by_llm:
    claude:
      thinking_preset: bedrock-claude
      no_thinking_request_args: ${llm:no_thinking_request_args?}
      extra_env:
        ANTHROPIC_MODEL: '${llm:anthropic_model}'
    hunyuan:
      thinking_preset: hunyuan
      no_thinking_request_args: ${llm:no_thinking_request_args?}
      extra_env:
        ANTHROPIC_MODEL: '${llm:anthropic_model}'

merge:
  imports: append_unique

source: hyness-opencc
