# Published engine + App pair on the scaffold-apps tag; use exact versions for reproducibility.
body:
  imports:
  - nexus.extensions.agents.hyness
  agent_name: hyness
  agent_config:
    packages: ${oc.decode:${oc.env:HYNESS_PACKAGES,'["@tencent/hyness@0.0.1-scaffold-apps.20261021.7","@tencent/hyness-swe-agent@0.1.0-scaffold-apps.20261021.7"]'}}
    app_config: '@tencent/hyness-swe-agent/apps/swe-agent/app.yaml'
    app_config_overlay: ${oc.decode:${oc.env:HYNESS_APP_CONFIG_OVERLAY,null}}
    harness_id: swe-agent
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    max_turns: ${oc.decode:${oc.env:AGENT_MAX_TURNS,600}}
    npm_registry: ${oc.env:NPM_REGISTRY,https://mirrors.tencent.com/npm/}
    stop_on_tool_error: ${oc.decode:${oc.env:HYNESS_STOP_ON_TOOL_ERROR,false}}
    extra_cli_args:
    - --setting-sources
    - user
    extra_env:
      CLAUDE_CODE_ATTRIBUTION_HEADER: '0'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
      DISABLE_AUTO_COMPACT: '1'
      DISABLE_COMPACT: '1'
    preserve_tool_schema: true
  agent_config_by_llm:
    claude:
      thinking_preset: bedrock-claude
      no_thinking_request_args: ${llm:no_thinking_request_args?}
      extra_env:
        ANTHROPIC_MODEL: ${llm:anthropic_model}
    hunyuan:
      thinking_preset: hunyuan
      no_thinking_request_args: ${llm:no_thinking_request_args?}
      extra_env:
        ANTHROPIC_MODEL: ${llm:anthropic_model}
merge:
  imports: append_unique
source: hyness-swe-agent
