# Hermes Agent Profile（pip 安装，因此没有 npm_registry）
#
# 版本默认值: 0.19.0 是测试有效的版本
#
# 环境变量：
#   必填: 无
#   可选:
#       AGENT_VERSION
#       AGENT_WORKING_DIR
#       AGENT_TIMEOUT
#       AGENT_MAX_ITERATIONS
#
# 使用示例：
#   AGENT_CONFIG=hermes

body:
  imports:
    - nexus.extensions.agents.hermes
  agent_name: hermes

  agent_config:
    working_dir: ${oc.env:AGENT_WORKING_DIR,/testbed}
    # oc.env 一律返回字符串，数值和布尔值都要套 oc.decode 还原类型。
    timeout: ${oc.decode:${oc.env:AGENT_TIMEOUT,14400}}
    version: ${oc.env:AGENT_VERSION,0.19.0}
    max_turns: ${oc.decode:${oc.env:AGENT_MAX_ITERATIONS,300}}
    model: ${oc.select:openai_clients.main.config.request_args.model,null}

merge:
  imports: append_unique

source: hermes
