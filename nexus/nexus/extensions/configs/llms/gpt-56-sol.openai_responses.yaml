# AIHub 2.0 GPT-5.6 SOL LLM Profile
#
# 协议与路由：
#   Client=openai_responses（不是 chat 的 openai）
#   Endpoint=http://api.aihub.woa.com/standard/v1/responses
#   Model=gpt-5.6-sol；Bearer 钉 ?provider=azure
#   AIHub 2.0 标准协议不钉厂商时每个请求自己挑厂商：gpt-5.6-sol 有 azure 和 openai 两家。
#   2026-10-19 实测（swe/smoke/aihub2-provider-pin/probe4.sh）：不钉 10/10 落 azure，钉 azure / openai 都 200，钉 aws_third 401。
#   钉成 azure = 当前实际路由，只是不再允许它中途换家。
#
# 推理配置：
#   reasoning.effort 默认 max；summary=detailed；mode=standard
#   store=false、include=[reasoning.encrypted_content]、max_output_tokens=128000
#
# 环境变量：
#   必填：HR_API_KEY
#   可选：
#       MAX_TOKENS
#       LLM_TIMEOUT
#       LLM_MAX_RETRIES
#       REASONING_EFFORT
#       REASONING_SUMMARY
#       REASONING_MODE
#
# 使用示例：
#   LLM_CONFIG=gpt-56-sol.openai_responses

body:
  imports:
    - nexus.extensions.openai_clients.openai_responses

  # Facts about this model. The scaffold decides what to do with them, in its
  # agent_config_by_llm section; this file never names a scaffold.
  llm:
    family: gpt
    # Deliberately absent: this is the aihub2 'standard' endpoint (see Endpoint below), now pinned
    # to azure, but encrypted reasoning replay on this endpoint has not been verified the way the
    # /openai endpoint was, so a scaffold must not rely on it yet.
    # Omitted rather than `false` so the fact and its absence both read as intentional; the scaffold's
    # agent_config_by_llm.gpt falls back to its own `use_azure_provider: false` default.
    # 协议无关的推理档位 fact，供 scaffold 读取，scaffold 不必知道这条 wire 怎么拼字段。
    # 这条 wire 的真实字段是 openai_responses 的 reasoning.effort；和下面 request_args 用同一个 env var，不会不一致。
    reasoning_effort: ${oc.env:REASONING_EFFORT,xhigh}

    # 这条 wire 走 Responses，推理以原生 reasoning_items 下发，所以 codex 的 Responses
    # 转换器不该再从纯文本 reasoning_content 另铸一个 reasoning item（会重复）。
    # 这是 per-wire 事实而不是家族事实：litellm / openai chat / vertex_anthropic /
    # infer_proxy 只有纯文本 reasoning_content，必须吃 true 的默认值，否则推理信号丢掉。
    # 生产同样只在 openai_responses 的 llm 文件上声明 false（4/25 份）。
    wrap_plaintext_reasoning_content: false

  openai_clients:
    main:
      name: openai_responses
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}?provider=azure'
          endpoint: 'http://api.aihub.woa.com/standard/v1/responses'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,12000}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,32}}
          capture_raw_io: true
          cache_task_id_from_run_id: true

        request_args:
          model: 'gpt-5.6-sol'
          store: false
          stream: false
          max_output_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
          # 给 agent_config.reasoning_effort 的 oc.select 用；client 会把它并进 reasoning.effort
          reasoning_effort: ${oc.env:REASONING_EFFORT,xhigh}
          reasoning:
            effort: ${oc.env:REASONING_EFFORT,xhigh}
            summary: ${oc.env:REASONING_SUMMARY,detailed}
            mode: ${oc.env:REASONING_MODE,standard}
          include:
            - reasoning.encrypted_content

merge:
  imports: append_unique

source: aihub2-gpt56-sol-openai-responses
