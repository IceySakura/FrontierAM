# AIHub 2.0 Claude Opus 4.8 LLM Profile。
#
# 协议与路由：
#   Client=openai；Endpoint=http://api.aihub.woa.com/standard/v1/chat/completions；Model=claude-opus-4-8；Bearer credential 必须携带 ?provider=aws_third，否则 AIHub 会把 claude-opus-4-8 路由到 google-vertex 而不是 aws_third
#
# 推理配置：
#   adaptive thinking、summarized display、effort=max，并启用 Anthropic prompt cache 断点
#   thinking / output_config 放 extra_body，不经 LiteLLM 的 effort 白名单
#
# 环境变量：
#   必填：HR_API_KEY（添加 ?provider=aws_third 会设置服务商为 aws_third）
#   可选：
#    MAX_TOKENS
#    LLM_TIMEOUT
#    LLM_MAX_RETRIES
#    THINKING_TYPE
#    THINKING_EFFORT
#    CACHE_CONTROL_ENABLED
#    CACHE_CONTROL_STRATEGY
#
# 使用示例：
#   LLM_CONFIG=claude-opus-48.openai

body:
  imports:
    - nexus.extensions.openai_clients.openai

  # Facts about this model. The scaffold decides what to do with them, in its
  # agent_config_by_llm section; this file never names a scaffold.
  llm:
    family: claude
    anthropic_model: 'claude-opus-4-8[1m]'
    no_thinking_request_args:
      model: 'claude-opus-4-8'
      max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
    # 协议无关的推理档位 fact，供 scaffold 读取，scaffold 不必知道这条 wire 怎么拼字段。
    # 这条 wire 的真实字段是 openai 的 extra_body.output_config.effort；和下面 request_args 用同一个 env var，不会不一致。
    reasoning_effort: ${oc.env:THINKING_EFFORT,xhigh}

  openai_clients:
    main:
      name: openai
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}?provider=aws_third'
          base_url: 'http://api.aihub.woa.com/standard/v1'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,900}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,15}}
          cache_control_enabled: ${oc.decode:${oc.env:CACHE_CONTROL_ENABLED,true}}
          cache_control_strategy: ${oc.env:CACHE_CONTROL_STRATEGY,claude_code}
          # 不能放 log_llm_usage：client_args 会原样喂给 AsyncOpenAI，它的构造函数不认这个 key

        request_args:
          model: 'claude-opus-4-8'
          max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
          # AsyncOpenAI 的 chat.completions.create 是显式签名，多余的顶层字段会抛 TypeError；extra_body 会被原样并进请求 JSON，于是 Anthropic 专有字段走这里。
          extra_body:
            thinking:
              # 可选: adaptive, enabled, disabled
              type: ${oc.env:THINKING_TYPE,adaptive}
              display: summarized
            output_config:
              effort: ${oc.env:THINKING_EFFORT,xhigh}

        # 脚手架可以在请求里自带 temperature，且会覆盖上面的 request_args。上面开了 thinking，而 Anthropic 此时只接受 temperature=1
        enforced_request_args:
          temperature: 1

merge:
  imports: append_unique

source: aihub2-opus48-openai
