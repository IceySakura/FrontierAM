# AIHub 2.0 Taiji HY3 LLM Profile。
#
# 协议与路由：
#   Client=openai（Chat Completions）
#   Endpoint=http://api.aihub.woa.com/openapi/v2/chat/completions；Model=hy3
#   Bearer 必须带 ?provider=taiji
#
# 环境变量：
#   必填：HR_API_KEY
#   可选：
#       MAX_TOKENS
#       LLM_TIMEOUT
#       LLM_MAX_RETRIES
#
# 使用示例：
#   LLM_CONFIG=hy3.openai
#
# curl 测试指令:
# curl -X POST 'http://api.aihub.woa.com/openapi/v2/chat/completions' \
#   -H "Authorization: Bearer ${HR_API_KEY}?provider=taiji" \
#   -H 'Content-Type: application/json' \
#   -d '{
#     "model": "hy3",
#     "messages": [
#       {"role": "user", "content": "北京今天天气怎么样 (请深度思考后回答)"}
#     ],
#     "reasoning_effort": "high",
#     "prompt_cache_key": "hy3-example",
#     "max_tokens": 4096,
#     "temperature": 0.9,
#     "top_p": 1.0,
#     "stream": false,
#     "response_format": {"type": "json_object"},
#     "tools": [
#       {"type": "function", "function": {
#         "name": "get_weather",
#         "description": "获取城市天气",
#         "parameters": {
#           "type": "object",
#           "properties": {
#             "city": {"type": "string", "description": "城市名"}},
#           "required": ["city"]}}}
#     ],
#     "tool_choice": "auto"
#   }'

body:
  imports:
    - nexus.extensions.openai_clients.openai

  # Facts about this model. The scaffold decides what to do with them, in its
  # agent_config_by_llm section; this file never names a scaffold.
  llm:
    family: hunyuan
    anthropic_model: 'claude-opus-4-8[1m]'
    no_thinking_request_args:
      model: 'hy3'
      max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,32768}}
      temperature: 1.0
      reasoning_effort: no_think
    # 协议无关的推理档位 fact，供 scaffold 读取，scaffold 不必知道这条 wire 怎么拼字段。
    # 这条 wire 的真实字段是 openai chat 的 reasoning_effort 顶层字段；和下面 request_args 用同一个 env var，不会不一致。
    reasoning_effort: ${oc.env:REASONING_EFFORT,high}

  openai_clients:
    main:
      name: openai
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}?provider=taiji'
          base_url: 'http://api.aihub.woa.com/openapi/v2'
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,900}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,15}}
          # 不能放 log_llm_usage 或 cache_control_*：client_args 会原样喂给 AsyncOpenAI

        request_args:
          model: 'hy3'
          temperature: 1.0
          top_p: 1.0
          max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,32768}}
          reasoning_effort: ${oc.env:REASONING_EFFORT,high}
          extra_body:
            chat_template_kwargs:
              preserved_thinking: true
              interleaved_thinking: true

merge:
  imports: append_unique

source: aihub-hy3-openai
