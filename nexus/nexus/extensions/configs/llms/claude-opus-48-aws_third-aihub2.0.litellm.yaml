# litellm / AWS bedrock Claude Opus 4.8 LLM Profile。
#
# 协议与路由：
#   AIHub 2.0：litellm bedrock invoke，请求落到 http://api.aihub.woa.com/model/anthropic.claude-opus-4-8/invoke；
#   Bearer 必须带 ?provider=aws_third；
#   模型名带 provider 前缀（bedrock/invoke/anthropic.claude-opus-4-8）；
#   Anthropic 专有字段直接放 request_args 顶层，不需要 extra_body。
#
# 环境变量：
#   必填：HR_API_KEY（裸 key，由本文件补上 ?provider=aws_third）
#   可选：
#       MAX_TOKENS
#       LLM_TIMEOUT
#       LLM_MAX_RETRIES
#       THINKING_TYPE
#       THINKING_EFFORT   # high / medium / low；不接受 xhigh 和 max
#       CACHE_CONTROL_ENABLED
#       CACHE_CONTROL_STRATEGY
#       LOG_LLM_USAGE
#
# 使用示例：
#   LLM_CONFIG=claude-opus-48-aws_third-aihub2.0.litellm

body:
  imports:
    - nexus.extensions.openai_clients.litellm

  # Facts about this model. The scaffold decides what to do with them, in its
  # agent_config_by_llm section; this file never names a scaffold.
  llm:
    family: claude
    anthropic_model: 'claude-opus-4-8[1m]'
    no_thinking_request_args:
      model: 'bedrock/invoke/anthropic.claude-opus-4-8'
      max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,65535}}
    # 输出上限 128000（claude-opus-4-8 / claude-opus-5 在 litellm 成本表里都是 128000）。
    # 有的 scaffold 会把这两个事实写进自己的 catalog 的 context_window，并直接拿它当
    # max_tokens 发请求，默认的 1000000 会被 litellm 这条线拒掉（claude-opus-5.litellm 真沙盒实测 400：
    # max_tokens: 1000000 > 128000）。同一个 litellm client、同一条路径的 opus-4.8 文件一并声明。
    # 只有 litellm 这条线声明：claude-opus-5.openai 在默认值下已真沙盒跑通，不要为了"一致"去改它。
    context_window: 128000
    auto_compact_token_limit: 115000
    # 协议无关的推理档位 fact，供 scaffold 读取，scaffold 不必知道这条 wire 怎么拼字段。
    # 这条 wire 的真实字段是 litellm/Anthropic 的 output_config.effort；和下面 request_args 用同一个 env var，不会不一致。
    reasoning_effort: ${oc.env:THINKING_EFFORT,high}

  openai_clients:
    main:
      name: litellm
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}?provider=aws_third'
          base_url: 'http://api.aihub.woa.com'
          # 数值和布尔值都要套 oc.decode：oc.env 一律返回字符串
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,900}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,15}}
          cache_control_enabled: ${oc.decode:${oc.env:CACHE_CONTROL_ENABLED,true}}
          cache_control_strategy: ${oc.env:CACHE_CONTROL_STRATEGY,claude_code}
          # 记录 token 数、cache 命中率等；仅 nexus 内部消费
          log_llm_usage: ${oc.decode:${oc.env:LOG_LLM_USAGE,true}}

        request_args:
          model: 'bedrock/invoke/anthropic.claude-opus-4-8'
          # bedrock invoke transformer 不认 thinking/output_config，不声明会报 UnsupportedParamsError。
          # 生产 artifact 任务用 drop_params=true 规避，代价是 thinking 被丢掉；
          # 这里改用 allowed_openai_params 透传，实测 thinking 真的生效（clients.py:114 是另一种取舍）。
          allowed_openai_params: ['thinking', 'output_config']
          # scaffold 自己带、而这条路径不能收的参数，丢掉：
          #   reasoning_effort  kilo / cline / workbuddy 带的 OpenAI 风格参数，bedrock invoke 不认；
          #                     effort 已由下面的 output_config.effort 传了，是冗余的
          #   temperature       kilo 带的不是 1；开着 thinking 时 Bedrock 只接受 1，丢掉后上游按默认值 1 算。
          #                     代价：THINKING_TYPE=disabled 时 scaffold 设的 temperature 也会被丢掉
          #   verbosity         codex 经 responses_proxy（converter.py:204）把 text.verbosity 转成这个
          #                     chat 参数，anthropic provider 直接拒（claude-opus-5.litellm 上实测 400）
          additional_drop_params: ['reasoning_effort', 'temperature', 'verbosity']
          max_tokens: ${oc.decode:${oc.env:MAX_TOKENS,65535}}
          thinking:
            # 可选: adaptive, enabled, disabled
            type: ${oc.env:THINKING_TYPE,adaptive}
            display: summarized
          output_config:
            # opus-4-8 只能是 high / medium / low（实测）。litellm 的 anthropic transformer 在本地校验：
            # xhigh 不在合法值里，max 只给 Opus 4.6。填错时在发请求前就抛 ValueError，litellm 反复重试，
            # agent 一直收不到数据，dsh 这类会表现成 300s stream idle timeout。
            effort: ${oc.env:THINKING_EFFORT,high}

merge:
  imports: append_unique

source: aihub2-aws-third-opus48-litellm
