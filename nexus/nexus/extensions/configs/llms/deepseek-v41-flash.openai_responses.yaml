# AIHub DeepSeek v4.1 flash LLM Profile（评测大表 DS 列同一条线）
#
# 协议与路由：
#   Client=openai_responses；Endpoint=http://api.aihub.woa.com/v1/responses（注意没有 /openai 或 /standard 前缀）
#   key 里的 provider 由 client_args.gateway_routing 合并成 ?provider=deepseek，所以这里写裸 key
#   模型名带过期后缀：deepseek-v4.1-flash-expires-on-0910（2026-10-16 实测仍可用；去掉后缀返回 401 模型不存在）
#
# 推理配置：reasoning.effort 默认 max，summary 默认 auto，temperature=top_p=1，store=false，max_output_tokens=128000
#   对齐 swe/eval/runs/evalmx_dsv41flash_max/generator.py 的 _build_openai_clients。
#
# 环境变量：
#   必填：HR_API_KEY
#   可选：MAX_TOKENS / LLM_TIMEOUT / LLM_MAX_RETRIES / REASONING_EFFORT / REASONING_SUMMARY
#
# 使用示例：
#   LLM_CONFIG=deepseek-v41-flash.openai_responses

body:
  imports:
    - nexus.extensions.openai_clients.openai_responses

  llm:
    # DeepSeek 没有单独的 family；它走 Responses 协议、输出 reasoning summary，行为上归 gpt 这一族。
    family: gpt
    reasoning_effort: ${oc.env:REASONING_EFFORT,max}

    # 这条 wire 走 Responses，推理以原生 reasoning_items 下发，所以 codex 的 Responses
    # 转换器不该再从纯文本 reasoning_content 另铸一个 reasoning item（会重复）。
    # 这是 per-wire 事实而不是家族事实：litellm / openai chat / vertex_anthropic /
    # infer_proxy 只有纯文本 reasoning_content，必须吃 true 的默认值，否则推理信号丢掉。
    # 生产同样只在 openai_responses 的 llm 文件上声明 false（4/25 份）。
    wrap_plaintext_reasoning_content: false

  openai_clients:
    main:
      name: openai_responses
      config:
        client_args:
          api_key: '${oc.env:HR_API_KEY}'
          endpoint: 'http://api.aihub.woa.com/v1/responses'
          gateway_routing:
            provider: deepseek
          timeout: ${oc.decode:${oc.env:LLM_TIMEOUT,12000}}
          max_retries: ${oc.decode:${oc.env:LLM_MAX_RETRIES,32}}
          capture_raw_io: true
          # key 的 ? 查询串里带 per-run cache_task_id，AIHub 据此做账号绑定和 KV cache 复用（iwiki 4031597247）
          cache_task_id_from_run_id: true

        request_args:
          model: 'deepseek-v4.1-flash-expires-on-0910'
          store: false
          stream: false
          temperature: 1.0
          top_p: 1.0
          max_output_tokens: ${oc.decode:${oc.env:MAX_TOKENS,128000}}
          reasoning:
            effort: ${oc.env:REASONING_EFFORT,max}
            summary: ${oc.env:REASONING_SUMMARY,auto}

merge:
  imports: append_unique

source: aihub-deepseek-v41-flash-openai-responses
